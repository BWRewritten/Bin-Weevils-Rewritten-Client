name: Build Installers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: win,   arch: x64 }
          - { os: windows-latest, platform: win,   arch: ia32 }
          - { os: macos-15-intel, platform: mac,   arch: x64 }
          - { os: ubuntu-24.04,   platform: linux, arch: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install
      - name: Install rpm tooling
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Use 32-bit Electron to compile the signing bytecode
        if: matrix.arch == 'ia32'
        shell: bash
        env:
          npm_config_arch: ia32
        run: rm -rf node_modules/electron/dist && node node_modules/electron/install.js
      - name: Write build secret
        env:
          BUILD_ARCH: ${{ matrix.arch }}
          BWR_BUILD_SECRET: ${{ secrets.BWR_BUILD_SECRET }}
        run: node scripts/write-build-secret.js
      - name: Build
        env:
          BUILD_ARCH: ${{ matrix.arch }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --config electron-builder.config.js --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: bwr-${{ matrix.platform }}-${{ matrix.arch }}
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.xz
            dist/*.yml
            dist/*.blockmap
            !dist/builder-debug.yml

  # Nothing here publishes: the builds use --publish never and the token is
  # read-only. This only gathers every file into one download, ready to attach
  # to a release made by hand.
  collect:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact/merge@v4
        with:
          name: BWR-release-files
          pattern: bwr-*
          delete-merged: true
          retention-days: 14

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    width: 120px;
    height: 72px;
    overflow: hidden;
    background: transparent;
    user-select: none;
  }
  #cog {
    position: absolute;
    top: 0;
    right: 0;
    width: 40px;
    height: 40px;
    padding: 4px;
    border: 0;
    outline: 0;
    background: transparent;
    cursor: pointer;
  }
  #cog img {
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
    opacity: 0.85;
    transition: opacity 0.15s, transform 0.15s;
  }
  #cog:hover img { opacity: 1; transform: rotate(30deg); }

  #tip {
    position: absolute;
    top: 44px;
    right: 0;
    padding: 4px 8px;
    border-radius: 4px;
    font: 12px Arial, sans-serif;
    white-space: nowrap;
    color: #fff;
    background: rgba(30, 30, 30, 0.9);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.12s;
  }
  #cog:hover + #tip {
    opacity: 1;
    transition-delay: 0.5s;
  }
</style>
</head>
<body>
  <button id="cog" aria-label="App Menu"><img src="../assets/app/cog.png"></button>
  <div id="tip">App Menu</div>
  <script>
    const { ipcRenderer } = require('electron');
    document.getElementById('cog').addEventListener('click', () => ipcRenderer.send('menu:toggle'));
  </script>
</body>
</html>
